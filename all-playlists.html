    .controls {

      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #b3b3b3;
      transition: color 0.3s;
    }

    .filter-group label:hover {
      color: #fff;
    }

    .filter-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #1db954;
    }

    .exclude-box {
      flex: 1;
      min-width: 200px;
      padding: 12px 20px;
      background: #181818;
      border: 2px solid #282828;
      border-radius: 24px;
      color: #fff;

      font-family: inherit;
      transition: border-color 0.3s;
    }

    .exclude-box:focus {
      outline: none;
      border-color: #e74c3c;
    }

      flex: 1;
      min-width: 200px;

      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    .exclude-box:focus {
      outline: none;
      border-color: #e74c3c;
    }

    .view-toggle {
      display: flex;
      background: #181818;
      border-radius: 24px;
      overflow: hidden;
    }

    .view-btn {
      padding: 12px 20px;
      background: transparent;
      border: none;
      color: #b3b3b3;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s;
    }

    .view-btn:hover {
      color: #fff;
    }

      background: #282828;
      color: #fff;
    }

    #playlist-container.list-view {

      max-width: 1200px;
      margin: 0 auto;
    }

    #playlist-container.list-view {

      margin: 0 auto;
      background: #181818;
      border-radius: 8px;
      overflow: hidden;

      text-decoration: none;
      color: #fff;
    }

      display: flex;
      align-items: center;
      padding: 8px 20px;
      border-bottom: 1px solid #282828;
      background: transparent;
      border-radius: 0;
      transition: background 0.2s;
      text-decoration: none;
      color: #fff;
    }

    #playlist-container.list-view .playlist-item:last-child {
      border-bottom: none;
    }

    #playlist-container.list-view .playlist-item:hover {

      color: #fff;
    }

      border-radius: 4px;
      margin-right: 12px;

      flex: 1;
      padding: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      min-width: 0;
    }

    #playlist-container.list-view .playlist-info {
      flex: 1;
      min-width: 0;
    }

      font-size: 0.9rem;
      font-weight: 400;

let filteredPlaylists = [...playlists];
let currentView = 'grid';

function renderPlaylists() {
  const container = document.getElementById('playlist-container');
  const noResults = document.getElementById('noResults');
  const count = document.getElementById('playlistCount');
  
  if (filteredPlaylists.length === 0) {
    container.style.display = 'none';
    noResults.style.display = 'block';
    count.textContent = '0 playlists';
    return;
  }
  
  container.className = currentView === 'list' ? 'list-view' : '';
  container.style.display = currentView === 'list' ? 'block' : 'grid';
  noResults.style.display = 'none';
  count.textContent = `${filteredPlaylists.length} playlist${filteredPlaylists.length !== 1 ? 's' : ''}`;
  
  container.innerHTML = filteredPlaylists.map(p => `
    <a href="${p.url}" target="_blank" class="playlist-item card">
      <div class="card-image" style="background-image: url('${p.image}')"></div>
      <div class="card-content">
        <div class="playlist-info">
          <h2>${p.name}</h2>
          ${currentView === 'list' && p.description ? `<p class="description">${p.description}</p>` : ''}
        </div>
        <p class="track-count">${p.tracks} ${p.tracks === 1 ? 'track' : 'tracks'}</p>
      </div>
    </a>
  `).join('');
}

function filterAndSort() {
  const searchTerm = document.getElementById('searchBox').value.toLowerCase();
  const showOwn = document.getElementById('filterOwn').checked;
  const showFollowing = document.getElementById('filterFollowing').checked;
  const hideEmpty = document.getElementById('filterEmpty').checked;
  const hideSmall = document.getElementById('filterSmall').checked;
  const hasDesc = document.getElementById('filterNoDesc').checked;
  const sortBy = document.getElementById('sortSelect').value;
  
  // Filter by ownership
  let filtered = playlists.filter(p => {
    if (!showOwn && p.isOwn) return false;
    if (!showFollowing && !p.isOwn) return false;
    return true;
  });
  
  // Filter by track count
  if (hideEmpty) {
    filtered = filtered.filter(p => p.tracks > 0);
  }
  if (hideSmall) {
    filtered = filtered.filter(p => p.tracks >= 10);
  }
  
  // Filter by description
  if (hasDesc) {
    filtered = filtered.filter(p => p.description && p.description.trim().length > 0);
  }
  
  // Filter by search
  if (searchTerm) {
    filtered = filtered.filter(p => 
      p.name.toLowerCase().includes(searchTerm) ||
      p.owner.toLowerCase().includes(searchTerm)
    );
  }
  
  filteredPlaylists = filtered;
  
  // Sort
  filteredPlaylists.sort((a, b) => {
    switch(sortBy) {
      case 'name-asc':
        return a.name.localeCompare(b.name);
      case 'name-desc':
        return b.name.localeCompare(a.name);
      case 'tracks-desc':
        return b.tracks - a.tracks;
      case 'tracks-asc':
        return a.tracks - b.tracks;
      default:
        return 0;
    }
  });
  
  renderPlaylists();
}

document.getElementById('searchBox').addEventListener('input', filterAndSort);
document.getElementById('filterOwn').addEventListener('change', filterAndSort);
document.getElementById('filterFollowing').addEventListener('change', filterAndSort);
document.getElementById('filterEmpty').addEventListener('change', filterAndSort);
document.getElementById('filterSmall').addEventListener('change', filterAndSort);
document.getElementById('filterNoDesc').addEventListener('change', filterAndSort);
document.getElementById('sortSelect').addEventListener('change', filterAndSort);

// View toggle
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    renderPlaylists();
  });
});

// Initial render
filterAndSort();
</script>
